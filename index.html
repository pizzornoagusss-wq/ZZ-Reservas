<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#643233">
  <title>ZZ Entrenamiento | Reservas</title>
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>

  <style>
  @font-face {
    font-family: 'Vogue';
    src: url('https://raw.githubusercontent.com/pizzornoagusss-wq/zz-reservas-fuentes/main/Vogue-Regular.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  * {
    box-sizing: border-box;
    font-family: var(--fuente-vogue) !important;
  }

  :root {
    --bordo: #643233;
    --bordo-oscuro: #4a2324;
    --bordo-suave: #f3eae8;
    --bordo-borde: rgba(100, 50, 51, 0.14);
    --fondo: #f7f4f2;
    --superficie: #ffffff;
    --superficie-sutil: #fcfaf9;
    --texto: #262221;
    --texto-secundario: #6e6562;
    --borde: #e6ddda;
    --exito: #385c43;
    --exito-fondo: #edf4ef;
    --alerta: #8a5a1e;
    --alerta-fondo: #fbf4e8;
    --error: #9c3838;
    --error-fondo: #faeeee;
    --sombra: 0 10px 32px rgba(61, 39, 37, 0.06);
    --fuente-vogue: 'Vogue', Georgia, "Times New Roman", serif;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
    background: var(--fondo);
    font-family: var(--fuente-vogue);
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--fuente-vogue);
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button,
  input {
    font: inherit;
    font-family: var(--fuente-vogue) !important;
  }

  button {
    border: 0;
    border-radius: 12px;
    min-height: 46px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.45px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
  }

  button:active {
    transform: scale(0.988);
  }

  button:focus-visible,
  input:focus-visible {
    outline: 3px solid rgba(100, 50, 51, 0.22);
    outline-offset: 2px;
  }

  button:disabled {
    cursor: not-allowed;
    transform: none;
  }

  .contenedor {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px calc(32px + env(safe-area-inset-bottom));
  }

  .encabezado {
    text-align: center;
    padding: 16px 0 24px;
  }

  .logo-contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 12px;
  }

  .logo-img {
    width: 96px;
    height: 96px;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    border-radius: 50%;
    box-shadow: 0 6px 20px rgba(61, 39, 37, 0.10);
    border: 1px solid var(--bordo-borde);
    background: var(--superficie);
    display: block;
  }

  .logo-texto {
    color: var(--bordo);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 2.6px;
    line-height: 1.2;
  }

  .subtitulo {
    color: var(--texto-secundario);
    font-size: 14px;
    letter-spacing: 0.6px;
    margin-top: 6px;
  }

  .panel {
    background: var(--superficie);
    border: 1px solid var(--bordo-borde);
    border-radius: 18px;
    padding: 24px 22px;
    box-shadow: var(--sombra);
    margin-bottom: 16px;
  }

  .panel-bienvenida {
    padding: 20px 22px;
  }

  .bienvenida-superior {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  #bienvenida {
    color: var(--bordo);
    font-size: 21px;
    font-weight: 400;
    letter-spacing: 0.4px;
    line-height: 1.25;
  }

  .abono-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 10px;
    font-size: 14px;
    letter-spacing: 0.3px;
    line-height: 1.35;
    width: 100%;
    background: var(--superficie-sutil);
    border: 1px solid var(--borde);
    color: var(--texto);
  }

  .abono-badge.vigente {
    background: var(--exito-fondo);
    border-color: rgba(56, 92, 67, 0.22);
    color: var(--exito);
  }

  .abono-badge.proximo {
    background: var(--alerta-fondo);
    border-color: rgba(138, 90, 30, 0.24);
    color: var(--alerta);
  }

  .abono-badge.vencido {
    background: var(--error-fondo);
    border-color: rgba(156, 56, 56, 0.24);
    color: var(--error);
  }

  .abono-punto {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: 0 0 auto;
    background: currentColor;
  }

  h2 {
    color: var(--texto);
    font-size: 21px;
    font-weight: 400;
    line-height: 1.25;
    margin: 0 0 6px;
    letter-spacing: 0.45px;
  }

  .seccion-descripcion {
    color: var(--texto-secundario);
    font-size: 14px;
    letter-spacing: 0.3px;
    margin: 0 0 18px;
    line-height: 1.45;
  }

  .semana-etiqueta {
    display: inline-block;
    background: var(--bordo-suave);
    color: var(--bordo);
    border: 1px solid var(--bordo-borde);
    border-radius: 9px;
    padding: 6px 12px;
    font-size: 13px;
    letter-spacing: 0.4px;
    margin-bottom: 14px;
  }

  label {
    display: block;
    color: #463d3b;
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.35px;
    margin: 12px 0 6px;
  }

  input {
    display: block;
    width: 100%;
    min-height: 50px;
    padding: 13px 15px;
    margin: 6px 0 15px;
    border: 1px solid var(--borde);
    border-radius: 11px;
    font-size: 16px;
    letter-spacing: 0.35px;
    line-height: 1.3;
    background: var(--superficie-sutil);
    color: var(--texto);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
  }

  input::placeholder {
    color: #9b928f;
    opacity: 1;
  }

  input:focus {
    background: #ffffff;
    border-color: var(--bordo);
    box-shadow: 0 0 0 3px rgba(100, 50, 51, 0.10);
  }

  .principal {
    width: 100%;
    background: var(--bordo);
    color: #ffffff;
    min-height: 51px;
    margin-top: 4px;
    letter-spacing: 0.6px;
  }

  .principal:hover:not(:disabled) {
    background: var(--bordo-oscuro);
  }

  .principal:active {
    background: var(--bordo-oscuro);
  }

  .enlace-secundario {
    display: block;
    width: 100%;
    min-height: 40px;
    margin-top: 10px;
    padding: 8px 10px;
    background: transparent;
    color: var(--bordo);
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .enlace-secundario:hover {
    background: var(--bordo-suave);
  }

  .cancelar {
    background: var(--bordo-suave);
    color: var(--bordo);
    border: 1px solid var(--bordo-borde);
    margin-top: 12px;
    width: 100%;
    min-height: 45px;
  }

  .cancelar:hover {
    background: #eadcdb;
  }

  .navegacion {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-bottom: 16px;
    background: #ede7e4;
    padding: 5px;
    border-radius: 14px;
  }

  .navegacion button {
    background: transparent;
    color: #5b514e;
    min-height: 44px;
    padding: 9px 7px;
    font-size: 13.5px;
    letter-spacing: 0.35px;
    line-height: 1.25;
    border-radius: 10px;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }

  .navegacion button.activo {
    background: var(--bordo);
    color: #ffffff;
    box-shadow: 0 3px 10px rgba(100, 50, 51, 0.18);
  }

  .dia-selector {
    width: 100%;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-align: left;
    background: var(--superficie-sutil);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 13px;
    padding: 14px 16px;
    margin: 9px 0;
    font-size: 15.5px;
    font-weight: 400;
    letter-spacing: 0.4px;
  }

  .dia-selector:hover {
    border-color: rgba(100, 50, 51, 0.30);
    background: #ffffff;
  }

  .dia-selector.abierto {
    border-color: var(--bordo);
    background: #ffffff;
  }

  .turnos-dia {
    padding: 2px 0 10px;
  }

  .turno {
    background: #ffffff;
    border: 1px solid var(--borde);
    padding: 14px 15px;
    border-radius: 13px;
    margin: 8px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .turno.completo {
    background: #faf7f6;
  }

  .turno-info {
    min-width: 0;
    flex: 1 1 auto;
  }

  .turno-info strong {
    display: block;
    color: var(--texto);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.4px;
  }

  .turno-info small {
    color: var(--texto-secundario);
    display: block;
    margin-top: 4px;
    font-size: 13.5px;
    letter-spacing: 0.25px;
    line-height: 1.4;
  }

  .turno-info small.completo-texto {
    color: var(--bordo);
  }

  .turno button {
    flex: 0 0 auto;
    background: var(--bordo);
    color: #ffffff;
    min-width: 112px;
    min-height: 44px;
    padding: 10px 14px;
    font-size: 14px;
  }

  .turno button:hover:not(:disabled) {
    background: var(--bordo-oscuro);
  }

  .turno button:disabled {
    background: #ebe5e3;
    color: #776d69;
  }

  .reserva {
    border-bottom: 1px solid #ede7e4;
    padding: 16px 0;
  }

  .reserva:first-child {
    padding-top: 4px;
  }

  .reserva:last-child {
    border-bottom: 0;
    padding-bottom: 4px;
  }

  .reserva-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .reserva strong {
    color: var(--texto);
    font-size: 16px;
    font-weight: 400;
    letter-spacing: 0.35px;
  }

  .estado-pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 0.3px;
  }

  .estado-pill.reservada {
    background: var(--exito-fondo);
    color: var(--exito);
  }

  .estado-pill.cancelada {
    background: #f1ecea;
    color: var(--texto-secundario);
  }

  .mensaje {
    font-size: 14px;
    letter-spacing: 0.3px;
    margin-top: 14px;
    line-height: 1.5;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }

  .mensaje:empty {
    display: none;
  }

  .error {
    color: var(--error);
  }

  .exito {
    color: var(--exito);
  }

  .oculto {
    display: none !important;
  }

  .salir {
    display: block;
    margin: 8px auto 0;
    background: transparent;
    color: var(--texto-secundario);
    min-height: 46px;
    width: 100%;
    font-size: 14.5px;
  }

  .salir:hover {
    color: var(--bordo);
  }

  @media (max-width: 380px) {
    .contenedor {
      padding-left: 12px;
      padding-right: 12px;
    }

    .panel {
      padding: 20px 16px;
    }

    .logo-img {
      width: 82px;
      height: 82px;
    }

    .logo-texto {
      font-size: 24px;
      letter-spacing: 1.8px;
    }

    .navegacion button {
      font-size: 12.5px;
      padding: 8px 4px;
    }

    .turno {
      padding: 12px 11px;
      gap: 8px;
    }

    .turno button {
      min-width: 96px;
      font-size: 13.5px;
      padding-left: 10px;
      padding-right: 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    html {
      scroll-behavior: auto;
    }

    button,
    input {
      transition: none;
    }
  }
  </style>
</head>
